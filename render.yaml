services:
  - type: web
    name: schedula-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/hello
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: schedula-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: TYPEORM_SYNCHRONIZE
        value: "true"

databases:
  - name: schedula-db
    plan: free
    databaseName: schedula
    user: schedula
